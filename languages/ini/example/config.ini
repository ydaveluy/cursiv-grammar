# Both comment markers are recognised.
; A comment line is a blank line whose comment the skipper hid.

title = "cursiv"
version = 4
released = false

pi = 3.14159
small = 1e-3

[server]
host = "localhost"
port = 8080
tls = true

[server.limits]
# A dotted key written with spaces around the dots: the parts are joined, so
# the key is "read.timeout.ms".
read . timeout . ms = 250
write.timeout.ms = -250

[client]   ; a comment after a section header
agent = "cursiv/4 \"UA\""     # and another after a value
retries = +3
factor = -2.5E+2
