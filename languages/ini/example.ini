# cursiv -- exemple INI/TOML restreint.
; Les deux marqueurs de commentaire sont reconnus, et une ligne de commentaire
; est une ligne blanche dont le commentaire a ete cache par le skipper.

titre = "cursiv"
version=4
publie   =   false

pi = 3.14159
petit = 1e-3

[serveur]
hote = "localhost"
port = 8080
tls = true

[serveur.limites]
# Une cle pointee ecrite avec des espaces autour des points : data<> joint
# les parties, la valeur de la cle est "delai.lecture.ms".
delai . lecture . ms = 250
delai.ecriture.ms = -250

[client]   ; un commentaire apres un en-tete de section
agent = "cursiv/4 \"UA\""     # et un autre apres une valeur
essais = +3
facteur = -2.5E+2

[dernier]
# La derniere ligne du fichier n'a PAS de saut de ligne final : elle ne peut
# se terminer que sur eof.
sans_saut_de_ligne_final = true