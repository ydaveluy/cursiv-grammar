name: Languages

# A push builds the languages it changes; a Cursiv commit that passed its own
# CI dispatches a build of every language against that commit.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cursiv-engine-updated]

permissions:
  contents: read

concurrency:
  group: languages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  select:
    name: Select languages
    runs-on: ubuntu-26.04
    outputs:
      languages: ${{ steps.select.outputs.languages }}
      count: ${{ steps.select.outputs.count }}
      engine_sha: ${{ steps.engine.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and reporting
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select changed languages
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD"
      - name: Resolve Cursiv revision once
        if: steps.select.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ydaveluy/cursiv
          ref: ${{ github.event.client_payload.engine_ref || 'main' }}
          path: .cache/cursiv-engine
          persist-credentials: false
      - name: Record Cursiv revision
        id: engine
        if: steps.select.outputs.count != '0'
        run: |
          revision=$(git -C .cache/cursiv-engine rev-parse HEAD)
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "Cursiv: $revision" >> "$GITHUB_STEP_SUMMARY"

  # One tree per compiler, so Cursiv compiles once and Ninja overlaps the
  # languages. GCC and Clang flag different faults in a language's own code.
  build:
    name: ${{ matrix.compiler }}
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            container: gcc:16
            cc: gcc
            cxx: g++
          - compiler: Clang
            container: ""
            cc: clang-22
            cxx: clang++-22
    container: ${{ matrix.container }}
    env:
      CI_LANGUAGES: ${{ needs.select.outputs.languages }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ydaveluy/cursiv
          ref: ${{ needs.select.outputs.engine_sha }}
          path: .cache/cursiv-engine
          persist-credentials: false
      - name: Install GCC build tools
        if: matrix.compiler == 'GCC'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake git ninja-build python3 ccache
      - name: Install Clang build tools
        if: matrix.compiler == 'Clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
      - name: Configure ccache
        run: ccache --max-size 1G
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ubuntu26-${{ matrix.compiler }}-${{ needs.select.outputs.engine_sha }}-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/run_languages.py') }}
      - name: Build and test
        run: >-
          python3 .github/scripts/run_languages.py --compiler "${{ matrix.compiler }}"
          --cursiv-source .cache/cursiv-engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-${{ matrix.compiler }}
          path: build/ci-results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  report:
    name: Language results
    needs: [select, build]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.select.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: ci-*
          path: build/ci-results
      - name: Language OK / KO table
        env:
          CI_LANGUAGES: ${{ needs.select.outputs.languages }}
        run: python3 .github/scripts/report.py
