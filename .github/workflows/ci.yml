name: Languages

# A push builds the languages it changes; a Cursiv commit that passed its own
# CI dispatches a build of every language against that commit.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cursiv-engine-updated]

permissions:
  contents: read

concurrency:
  group: languages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  select:
    name: Select languages
    runs-on: ubuntu-26.04
    outputs:
      languages: ${{ steps.select.outputs.languages }}
      group_1: ${{ steps.select.outputs.group_1 }}
      group_2: ${{ steps.select.outputs.group_2 }}
      count: ${{ steps.select.outputs.count }}
      engine_sha: ${{ steps.engine.outputs.sha }}
      cursiv: ${{ steps.engine.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and reporting
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select changed languages
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select_languages.py --event "$EVENT" --base "$BASE" --head "$HEAD"
      - name: Resolve Cursiv revision once
        if: steps.select.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ydaveluy/cursiv
          ref: ${{ github.event.client_payload.engine_ref || 'main' }}
          path: .cache/cursiv-engine
          persist-credentials: false
      - name: Record Cursiv revision
        id: engine
        if: steps.select.outputs.count != '0'
        env:
          RECIPE: ${{ hashFiles('.github/workflows/ci.yml') }}
        run: |
          revision=$(git -C .cache/cursiv-engine rev-parse HEAD)
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          # The cache key of the installed Cursiv, which each compiler completes.
          echo "package=cursiv-$revision-$RECIPE" >> "$GITHUB_OUTPUT"
          echo "Cursiv: $revision" >> "$GITHUB_STEP_SUMMARY"

  # Cursiv is built and installed once per compiler, and kept for the later
  # runs on the same revision. Every language job links that package.
  engine:
    name: Cursiv / ${{ matrix.compiler }}
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - compiler: GCC
            container: gcc:16
            cc: gcc
            cxx: g++
          - compiler: Clang
            container: ""
            cc: clang-22
            cxx: clang++-22
    container: ${{ matrix.container }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: package
        with:
          path: .cache/cursiv-install
          key: ${{ needs.select.outputs.cursiv }}-${{ matrix.compiler }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.package.outputs.cache-hit != 'true'
        with:
          repository: ydaveluy/cursiv
          ref: ${{ needs.select.outputs.engine_sha }}
          path: cursiv
          persist-credentials: false
      - name: Install GCC build tools
        if: steps.package.outputs.cache-hit != 'true' && matrix.compiler == 'GCC'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake git ninja-build
      - name: Build and install Cursiv
        if: steps.package.outputs.cache-hit != 'true'
        run: |
          cmake -S cursiv -B cursiv/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCURSIV_BUILD_TESTS=OFF
          cmake --build cursiv/build --target src/all
          cmake --install cursiv/build --prefix .cache/cursiv-install

  # A matrix holds at most 256 entries: two groups, one entry per language.
  # Four languages of each group build at a time, under both compilers:
  # sixteen jobs.
  languages_1:
    name: ${{ matrix.language }}
    needs: [select, engine]
    if: needs.select.outputs.group_1 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: ${{ fromJSON(needs.select.outputs.group_1) }}
    uses: ./.github/workflows/language.yml
    with:
      language: ${{ matrix.language }}
      cursiv: ${{ needs.select.outputs.cursiv }}

  languages_2:
    name: ${{ matrix.language }}
    needs: [select, engine]
    if: needs.select.outputs.group_2 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: ${{ fromJSON(needs.select.outputs.group_2) }}
    uses: ./.github/workflows/language.yml
    with:
      language: ${{ matrix.language }}
      cursiv: ${{ needs.select.outputs.cursiv }}

  report:
    name: Language results
    needs: [select, languages_1, languages_2]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.select.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: ci-*
          path: build/ci-results
      - name: Language OK / KO table
        env:
          CI_LANGUAGES: ${{ needs.select.outputs.languages }}
        run: python3 .github/scripts/report.py
