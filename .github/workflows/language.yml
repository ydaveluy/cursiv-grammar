name: Build one language

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      engine_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.engine }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - compiler: GCC
            engine: LL
            container: gcc:16
            cc: gcc
            cxx: g++
          - compiler: GCC
            engine: LR
            container: gcc:16
            cc: gcc
            cxx: g++
          - compiler: Clang
            engine: LL
            container: ""
            cc: clang-22
            cxx: clang++-22
          - compiler: Clang
            engine: LR
            container: ""
            cc: clang-22
            cxx: clang++-22
    container: ${{ matrix.container }}
    env:
      LANGUAGE: ${{ inputs.language }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CURSIV_SOURCE: ${{ github.workspace }}/.cache/cursiv-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ydaveluy/cursiv
          ref: ${{ inputs.engine_sha }}
          path: .cache/cursiv-engine
          persist-credentials: false
      - name: Install GCC build tools
        if: matrix.compiler == 'GCC'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake git ninja-build python3 ccache
      - name: Install Clang build tools
        if: matrix.compiler == 'Clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
      - name: Configure ccache
        run: ccache --max-size 1G
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ubuntu26-${{ matrix.compiler }}-${{ inputs.engine_sha }}-${{ hashFiles('.github/workflows/language.yml', '.github/scripts/run_language.py') }}
      - name: Build and test
        run: >-
          python3 .github/scripts/run_language.py --language "$LANGUAGE"
          --compiler-label "${{ matrix.compiler }}"
          --cc "${{ matrix.cc }}" --cxx "${{ matrix.cxx }}"
          --engine "${{ matrix.engine }}"
          --cursiv-source "$CURSIV_SOURCE" --clean-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-${{ inputs.language }}-${{ matrix.compiler }}-${{ matrix.engine }}
          path: build/ci-results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
